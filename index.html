<script>
    const API_URL = "https://wyhkjzhxbpjznfayokwm.supabase.co/rest/v1/Capturas";
    const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5aGtqemh4YnBqem5mYXlva3dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjg3MDEsImV4cCI6MjA5ODYwNDcwMX0.ObEQazEofg7El_0j6PXezNiWrBAeibW67YwDPiPJmLk";

    // 1. Capturamos el usuario de la URL (ejemplo: ?usuario=ElTucuPeque)
    const params = new URLSearchParams(window.location.search);
    const usuarioActual = params.get('usuario'); 

    // 2. Si no hay usuario en la URL, avisamos
    if (!usuarioActual) {
        document.getElementById("lista").innerHTML = "Por favor, añade ?usuario=TU_NOMBRE a la URL.";
    } else {
        // 3. Filtramos la consulta para que Supabase solo traiga los del usuario
        // La sintaxis 'eq' significa "equal" (igual a)
        const urlFiltrada = `${API_URL}?Usuario=eq.${encodeURIComponent(usuarioActual)}`;

        fetch(urlFiltrada, { 
            headers: { "apikey": KEY, "Authorization": "Bearer " + KEY } 
        })
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) {
                document.getElementById("lista").innerHTML = "No se encontraron Pokémon para " + usuarioActual;
            } else {
                document.getElementById("lista").innerHTML = data.map(p => `
                    <div class="card">
                        <strong>${p.Pokemon}</strong>
                    </div>
                `).join("");
            }
        });
    }
</script>
